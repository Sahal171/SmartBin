# Server Configuration
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# SmartBin Custom Properties
smartbin.storage.location=./uploads
smartbin.file.default-expiration-minutes=30
smartbin.file.cleanup-cron=0 * * * * *
smartbin.ratelimit.max-attempts=10
smartbin.ratelimit.window-seconds=60
smartbin.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
